<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order List Demo</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; gap: 40px; padding: 20px; }
    .container { width: 45%; }
    .item { border: 1px solid #ccc; padding: 10px; margin: 5px 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .item:hover { background-color: #f0f0f0; }
    .pinned { background-color: #fff3cd; }
    h2 { margin-top: 0; }
    input { padding: 5px; margin-bottom: 10px; width: 100%; }
    button { margin-left: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Items</h2>
  <input type="text" id="nameInput" placeholder="Enter name for order" />
  <input type="text" id="searchInput" placeholder="Search items..." />
  <div id="itemList"></div>
</div>

<div class="container">
  <h2>Order List</h2>
  <ul id="orderList"></ul>
  <button onclick="printOrder()">Print Order</button>
</div>

<script>
  let items = [];

  // Store combined orders
  const orders = [];

  const itemList = document.getElementById("itemList");
  const orderList = document.getElementById("orderList");
  const nameInput = document.getElementById("nameInput");
  const searchInput = document.getElementById("searchInput");

  function loadItems() {
    fetch('/products')
      .then(res => res.json())
      .then(data => {
        items = data.products.map(item => ({
          ...item,
          price: parseFloat(item.price.replace(',', '.'))
        }));
        renderItems();
      })
      .catch(err => console.error('Failed to load items:', err));
  }

  function renderOrderList() {
    orderList.innerHTML = '';
    orders.forEach(item => {
      const orderText = `${item.customer} - ${item.name} (ID: ${item.id}) - €${item.price}`;
      const li = document.createElement("li");
      const span = document.createElement("span");
      span.textContent = orderText;
      const removeBtn = document.createElement("button");
      removeBtn.textContent = "Remove";
      removeBtn.onclick = () => {
        const index = orders.indexOf(item);
        if (index > -1) orders.splice(index, 1);
        renderOrderList();
      };
      li.appendChild(span);
      li.appendChild(removeBtn);
      orderList.appendChild(li);
    });
  }

  function renderItems() {
    itemList.innerHTML = "";
    const search = searchInput.value.toLowerCase();

    const sortedItems = [...items].sort((a, b) => b.pinned - a.pinned);

    sortedItems
      .filter(item => item.name.toLowerCase().includes(search) || item.id.toLowerCase().includes(search))
      .forEach(item => {
        const div = document.createElement("div");
        div.className = "item" + (item.pinned ? " pinned" : "");

        const text = document.createElement("span");
        text.textContent = `${item.name} (ID: ${item.id}) - €${item.price}`;

        const actions = document.createElement("div");

        const pinBtn = document.createElement("button");
        pinBtn.textContent = item.pinned ? "Unpin" : "Pin";
        pinBtn.onclick = (e) => {
          e.stopPropagation();
          item.pinned = !item.pinned;
          fetch('/update_pin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: item.id, pinned: item.pinned })
          })
          .then(res => res.json())
          .then(data => {
            if (data.status === 'success') {
              renderItems();
            } else {
              alert('Failed to update pin');
              item.pinned = !item.pinned; // revert
            }
          })
          .catch(err => {
            alert('Error updating pin');
            item.pinned = !item.pinned; // revert
          });
        };

        actions.appendChild(pinBtn);
        div.appendChild(text);
        div.appendChild(actions);

        div.addEventListener("click", () => {
          const customerName = nameInput.value.trim();
          if (!customerName) {
            alert("Please enter a name first!");
            return;
          }
          // Create a copy of the item with the customer name
          const itemWithCustomer = { ...item, customer: customerName };
          orders.push(itemWithCustomer);
          renderOrderList();
        });

        itemList.appendChild(div);
      });
  }

  function printOrder() {
    const customerName = nameInput.value.trim();
    if (!customerName || !orders.length) {
      alert("Please enter a name and select items!");
      return;
    }

    const ordersToPrint = orders;

    fetch("http://localhost:5000/print", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        items: ordersToPrint.map(item => ({
          id: item.id,
          name: item.name,
          price: item.price,
          customer: item.customer
        })),
        customer_name: customerName
      })
    })
    .then(res => res.json())
    .then(msg => {
      alert(msg.message || msg.status);
      // Clear the orders after printing
      orders.length = 0;
      renderOrderList();
    })
    .catch(err => alert("Print failed: " + err));
  }

  searchInput.addEventListener("input", renderItems);

  loadItems();
</script>

</body>
</html>
